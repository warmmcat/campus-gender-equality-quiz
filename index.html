<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="大專性平知識大會考" />
  <title>大專性平知識大會考</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">大專性平知識大會考</a>
    <nav>
      <button id="adminNav" class="link-button hidden">管理後台</button>
      <button id="authButton" class="button">使用 Google 登入</button>
    </nav>
  </header>
  <main>
    <section id="homeView" class="hero">
      <p class="eyebrow">臺北醫學大學學生輔導中心</p>
      <h1>性平知識，從理解開始</h1>
      <p class="lead">登入 Google 帳號，完成 10 題是非題，立即查看解析。</p>
      <div id="accountStatus" class="status">尚未登入</div>
      <button id="startButton" class="button primary">登入後開始測驗</button>
    </section>

    <section id="quizView" class="panel hidden" aria-live="polite">
      <div class="progress-row"><span id="progressText"></span><progress id="progressBar" max="10"></progress></div>
      <h2 id="questionText"></h2>
      <div class="answer-grid">
        <button class="answer-button" data-answer="true">○ 這個敘述正確</button>
        <button class="answer-button" data-answer="false">× 這個敘述錯誤</button>
      </div>
    </section>

    <section id="resultView" class="panel hidden">
      <p class="eyebrow">測驗完成</p>
      <h2 id="scoreText"></h2>
      <div id="reviewList" class="review-list"></div>
      <button id="retryButton" class="button primary">再測一次</button>
    </section>

    <section id="adminView" class="panel hidden">
      <div class="section-heading"><div><p class="eyebrow">管理員專區</p><h2>題庫與測驗紀錄</h2></div><button id="closeAdmin" class="button">返回首頁</button></div>
      <p id="adminMessage" class="status"></p>
      <div class="admin-grid">
        <div><h3>題庫</h3><div id="questionAdminList"></div></div>
        <div><h3>完成紀錄</h3><div id="attemptList"></div></div>
      </div>
    </section>

    <section class="topics">
      <article><b>01. 尊重與界線</b><span>理解同意與身體自主</span></article>
      <article><b>02. 校園性平事件</b><span>辨識情境與求助管道</span></article>
      <article><b>03. 師生權勢關係</b><span>認識師生專業倫理與互動的適當界線</span></article>
      <article><b>04. 性侵害與求助</b><span>了解醫療、通報、輔導與法律資源</span></article>
      <article><b>05. 網路與隱私</b><span>尊重性自主、影像隱私與個人界線</span></article>
      <article><b>06. 申訴與調查</b><span>了解申請、通報程序與可獲得的協助</span></article>
    </section>
  </main>
  <footer>
    <span>© 2026 臺北醫學大學學生輔導中心</span>
    <a href="https://ismart.tmu.edu.tw/front/GECE1/pages.php?ID=776df906053d815350e7e70a23104001" target="_blank" rel="noopener">資源連結</a>
    <a href="mailto:gender@tmu.edu.tw">聯絡性平窗口</a>
    <a href="./privacy.html">隱私權政策</a>
  </footer>
  <dialog id="editDialog">
    <form id="editForm" method="dialog">
      <h2>修改題目</h2>
      <input id="editId" type="hidden" />
      <label>題目<textarea id="editPrompt" required></textarea></label>
      <label>答案<select id="editAnswer"><option value="true">○ 正確</option><option value="false">× 錯誤</option></select></label>
      <label>解答說明<textarea id="editExplanation"></textarea></label>
      <div class="dialog-actions"><button type="button" id="cancelEdit" class="button">取消</button><button type="submit" class="button primary">儲存</button></div>
    </form>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
